<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Titan Dashboard</title>
    <meta name="robots" content="noindex">
    <!--Local (ignorame)-->
    <link rel="stylesheet" href="../static/style/titan.css">
    <link rel="stylesheet" href="../static/style/dashboard.css">
    <!--Remote-->
    <link rel="stylesheet" href="/style/titan.css">
    <link rel="stylesheet" href="/style/dashboard.css">
</head>
<body>
<header class="mainSections">
    <nav class="navBar box">
        <h1>Titan</h1>
        <p id="timeLocal">Local --:--:--</p>
        <p id="timeRemote">Remote --:--:--</p>
        <p id="timeEchange">Exchange --:--:--</p>
    </nav>
</header>
<section class="mainSections" style="display: grid; grid-template-columns: 1fr 1fr;">
    <section class="box">
        <h2>Ordenes</h2>
    </section>
    <section class="box">
        <h2>Balance</h2>
        <ul>
            <li>
                <h3>Futuros</h3>
                <ul class="listSmall" id="futureBalance">
                    <li>
                        <div class="loader loaderSmall"></div>
                    </li>
                </ul>
            </li>
            <li>
                <h3>Spot</h3>
                <ul class="listSmall" id="spotBalance">
                    <li>
                        <div class="loader loaderSmall"></div>
                    </li>
                </ul>
            </li>
            <li>
                <h3>Fondos</h3>
                <ul class="listSmall" id="fondoBalance">
                    <li>
                        <div class="loader loaderSmall"></div>
                    </li>
                </ul>
            </li>
            <li>
                <h3>Total</h3>
                <ul class="listSmall" id="totalBalance">
                    <li>
                        <div class="loader loaderSmall"></div>
                    </li>
                </ul>
            </li>
        </ul>
    </section>
    <section class="box">
        <h2>Estrategias</h2>
        <ul id="strategy">
            <li>
                <div class="loader loaderSmall"></div>
            </li>
        </ul>
        <footer>
            <button>
                StopAll
            </button>
            <button>
                New
            </button>
        </footer>
    </section>
</section>
<div class="rgbEffect"></div>
<script src="/script/requestBalance.js"></script>
<script src="/script/requestStrategy.js"></script>

</body>
</html>
