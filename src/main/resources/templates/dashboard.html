<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Titan Dashboard</title>
    <meta name="robots" content="noindex">
    <!--Local (ignorame)-->
    <link rel="stylesheet" href="../static/style/titan.css">
    <link rel="stylesheet" href="../static/style/dashboard.css">
    <!--Remote-->
    <link rel="stylesheet" href="/style/titan.css">
    <link rel="stylesheet" href="/style/dashboard.css">
</head>
<body>
<main>
    <header class="headerBar box">
        <div class="barLeft">
            <h1>Titan</h1>
            <p id="timeLocal">Local --:--:--</p>
            <p id="timeRemote">Remote --:--:--</p>
            <p id="timeExchange">Exchange --:--:--</p>
        </div>
        <div class="barRight">
            <form style="display: flex" method="post" th:action="@{/auth/logout}" novalidate>
                <button type="submit">
                    Logout
                </button>
            </form>
            <button id="resetWindows">Reset</button>
        </div>
    </header>
    <article class="mainSections">
        <section class="box" id="logsWindow">
            <h2>Logs</h2>
            <div class="box" id="logs">
                <div class="cliLoader"></div>
            </div>
        </section>
        <section class="box" id="balanceWindow">
            <h2>Balance</h2>
            <div>
                <h3>Futuros USDⓈ-M</h3>
                <ul>
                    <li>
                        <strong>Disponible</strong>
                        <ul class="listSmall" id="futureBalance">
                            <li>
                                <span class="cliLoader"></span>
                            </li>
                        </ul>
                    </li>
                    <li>
                        <strong>Valorado</strong>
                        <ul class="listSmall" id="futureValued">
                            <li>
                                <span class="cliLoader"></span>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
            <div>
                <h3>Spot</h3>
                <ul class="listSmall" id="spotBalance">
                    <li>
                        <div class="cliLoader"></div>
                    </li>
                </ul>
            </div>
            <footer id="roi"><div class="cliLoader"></div></footer>
        </section>
        <section class="box" id="telemetryWindow">
            <h2>Telemetría <div class="webSocketClose" id="webSocketIndicator"></div></h2>
            <div>
                <h3>Connector</h3>
                <ul id="telemetryConnector">
                    <li>
                        <span class="cliLoader"></span>
                    </li>
                </ul>
            </div>
            <div>
                <h3>Sistema</h3>
                <ul id="telemetrySystem">
                    <li>
                        <span class="cliLoader"></span>
                    </li>
                </ul>
            </div>
        </section>
        <section class="box" id="positionWindow">
            <h2>Posiciones</h2>
            <table>
                <thead>
                <tr>
                    <th>Símbolo</th>
                    <th>quantity</th>
                    <th>entryPriceAvg</th>
                    <th>pnlUnrealize</th>
                </tr>
                </thead>
                <tbody id="positions">
                <tr>
                    <td><div class="cliLoader"></div></td>
                    <td><div class="cliLoader"></div></td>
                    <td><div class="cliLoader"></div></td>
                    <td><div class="cliLoader"></div></td>
                </tr>
                </tbody>
            </table>
        </section>
        <section class="box" id="strategyWindow">
            <h2>Estrategias</h2>
            <ul id="strategy">
                <li>
                    <div class="cliLoader"></div>
                </li>
            </ul>
        </section>
    </article>
</main>
<div class="rgbEffect"></div>

<pre id="output"></pre>
<script src="/script/utils.js"></script>
<script src="/script/requestBalance.js"></script>
<script src="/script/requestStrategy.js"></script>
<script src="/script/requestTime.js"></script>
<script src="/script/requestLogs.js"></script>
<script src="/script/requestPositions.js"></script>
<script src="/script/requestTelemetry.js"></script>
<script src="/script/websocket.js"></script>

<script src="/script/window.js"></script>
<script src="../static/script/window.js"></script>
<script>
    createWindow({id: "logsWindow",});
    createWindow({id: "balanceWindow",});
    createWindow({id: "strategyWindow",});
    createWindow({id: "telemetryWindow",});
    createWindow({id: "positionWindow",});
</script>

</body>
</html>
