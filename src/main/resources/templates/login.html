<!-- Estilo Inspirado De Murder Drones -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Titan</title>
    <meta name="robots" content="noindex">
    <!--Local (ignorame)-->
    <link rel="stylesheet" href="../static/style/titan.css">
    <link rel="stylesheet" href="../static/style/login.css">
    <!--Remote-->
    <link rel="stylesheet" href="/style/titan.css">
    <link rel="stylesheet" href="/style/login.css">
</head>
<body id="screen">
<!--Vas a entrar a la DeepWeb, Qué miedo-->
<main>
    <h1 class="title">Titan</h1>

    <section class="box windowContent" id="loginWindow">
        <form method="post" th:action="@{/auth/login}" novalidate>
            <label>
                <input class="loginInput" type="text" name="username" placeholder="username" autocomplete="off" required>
            </label>
            <label>
                <input class="loginInput" type="password" name="password" placeholder="password" autocomplete="off" required>
            </label>
            <button type="submit">
                Login
            </button>
            <div th:if="${param.error}" class="error" style="margin-top: 0.8rem">Invalid Credentials</div>
        </form>
    </section>
    <small style="position: fixed; top: 20px; right: 20px; opacity: 30%;">Titan Project</small>
</main>
<div class="rgbEffect"></div>
<!--<div class="linesEffect"></div>-->

<script src="/script/window.js"></script>
<script src="../static/script/window.js"></script>
</body>
</html>
