<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Titan</title>
    <meta name="robots" content="noindex">
    <!--Local-->
    <link rel="stylesheet" href="../static/css/titan.css">
    <link rel="stylesheet" href="../static/css/login.css">
    <!--Remote-->
    <link rel="stylesheet" href="/css/titan.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

<div id="screen">
    <h1 class="title">Titan</h1>
    <form method="post" th:action="@{/login}">
        <label>
            <input class="loginInput" type="text" name="username" placeholder="Username" required>
        </label>
        <label>
            <input class="loginInput" type="password" name="password" placeholder="Password" required>
        </label>
        <button id="loginButton" type="submit">
            Login
        </button>
    </form>
</div>
<div class="rgbEffect"></div>
<div class="linesEffect"></div>

</body>
</html>
